name: Stih dana — pjesme

# Admin na produkciji sačuva stih s pjesmom koje još nema → ruta
# /api/admin/audio pošalje `repository_dispatch` → ovdje se pjesma preuzme
# (yt-dlp), kodira u HE-AAC 64 kbps (afconvert — zato macOS), upiše joj se
# trajanje, sve pjesme odu na Cloudflare (odatle ih aplikacija pušta —
# lib/site.ts AUDIO_BASE) i sve se commita na trunk. Vercel objavi novi
# build i pjesma se pušta odmah. Isto što lokalno rade `npm run audio` i
# `npm run audio:deploy`.
#
# Ruta zna i stanje ovog workflowa (admin pokaže "preuzima se" / "nije uspjelo").
#
# YouTube GitHubov server bez prijave odbija ("not a bot") — zato kolačići
# YouTube naloga iz tajne YT_COOKIES (npm run cookies, DEPLOY.md → Pjesme).
on:
  repository_dispatch:
    # audio: preuzmi pjesme koje fale; audio-rename: admin je preimenovao pjesmu
    types: [audio, audio-rename]
  workflow_dispatch:

concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # yt-dlp za YouTube treba JavaScript runtime (deno)
      - uses: denoland/setup-deno@v2

      - name: yt-dlp
        run: python -m pip install --quiet --upgrade "yt-dlp[default]"

      # YouTube GitHubove servere bez prijave odbije ("Sign in to confirm you're
      # not a bot") — zato kolačići YouTube naloga, iz tajne YT_COOKIES (DEPLOY.md)
      - name: YouTube kolačići
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::Nema tajne YT_COOKIES — YouTube zna odbiti GitHub (DEPLOY.md → Pjesme)"
          fi

      - name: Preimenuj pjesmu
        if: github.event.action == 'audio-rename'
        env:
          STIH_AUDIO_FETCH: '1'
          AUDIO_FROM: ${{ github.event.client_payload.from }}
          AUDIO_TO: ${{ github.event.client_payload.to }}
          AUDIO_FILE: ${{ github.event.client_payload.file }}
        run: npx -y tsx@4.23.13 scripts/audio-rename.ts

      - name: Preuzmi pjesme koje fale
        if: github.event.action != 'audio-rename'
        # naziv i link idu kroz env, ne u skriptu — bez ubacivanja u shell
        env:
          STIH_AUDIO_FETCH: '1'
          AUDIO_SONG: ${{ github.event.client_payload.song }}
          AUDIO_YOUTUBE: ${{ github.event.client_payload.youtube }}
        run: npx -y tsx@4.23.13 scripts/audio-sync.ts

      # Prije commita: kad Vercel objavi novi build, Cloudflare pjesmu već ima.
      # Ne uspije li, aplikacija je pušta s Vercela (rezerva u lib/player.ts),
      # a commit ide svejedno. Tajne: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      - name: Pjesme na Cloudflare
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Nema tajne CLOUDFLARE_API_TOKEN — pjesme nisu poslane na Cloudflare (DEPLOY.md → Pjesme)"
            exit 0
          fi
          bash scripts/deploy-audio.sh

      - name: Commit i push
        # i kad neka pjesma ne prođe — one koje jesu idu gore
        if: ${{ !cancelled() }}
        run: |
          git add -A public/audio data/audio.json data/audio-alias.json
          if git diff --cached --quiet; then
            echo "Nema novih pjesama."
            exit 0
          fi
          nove=$(git diff --cached --name-only --diff-filter=AMR -- public/audio | xargs -n1 basename | sed 's/\.m4a$//' | paste -sd ', ' -)
          [ -n "$nove" ] || nove="nazivi"
          # autor je vlasnik projekta — Vercel objavljuje samo njegove commite
          git -c user.name="Haris Pandžić" -c user.email="42070972+pandzicharis@users.noreply.github.com" \
            commit -q -m "Pjesme: $nove"
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk
          echo "Objavljeno: $nove"
