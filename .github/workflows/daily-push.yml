name: Stih dana — push

on:
  schedule:
    # Svaki sat u :05. Ruta sama gleda kome je po njegovoj zoni vrijeme, pa
    # satni raspored pokriva sve vremenske zone i prelazak na ljetno vrijeme.
    #
    # Dupli poziv ne pravi duplu obavijest: `claim_due_subscriptions` u istoj
    # transakciji uzme i označi red, a `last_sent_on` pamti da je dan potrošen.
    - cron: '5 * * * *'
  workflow_dispatch:

# Ako prethodni prolaz još traje, ne pokreći drugi preko njega.
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pokreni slanje
        run: |
          curl -fsS --max-time 240 --retry 2 --retry-delay 15 \
            -X POST "$APP_URL/api/cron/send-daily" \
            -H "x-cron-secret: $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
