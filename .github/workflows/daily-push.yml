name: Stih dana — push

# Okidač odlučuje KAD stih stiže; ruta samo šalje onima koji ga za taj dan
# još nisu dobili (vidi app/api/cron/send-daily/route.ts).
#
# Zato ovdje stoji šest pokušaja umjesto jednog. Zakazani workflow na GitHubu
# nije obećanje: zna kasniti desetak minuta, a pod opterećenjem zna i biti
# preskočen — a jedan preskočen okidač je ranije značio dan bez stiha. Prvi
# pokušaj koji prođe zatvori dan, ostali zateknu prazan red i ne rade ništa.
#
# GitHub prima samo UTC i ne zna za ljetno vrijeme, pa je podne u Sarajevu
# ljeti 10:00 UTC a zimi 11:00. Zato pokušaji pokrivaju oba sata, a korak
# ispod pusti dalje samo one koji su u Sarajevu stvarno poslije podne:
#
#   ljeti   10:00 UTC = 12:00 → šalje;  11:00 UTC = 13:00 → nema kome
#   zimi    10:00 UTC = 11:00 → stane;  11:00 UTC = 12:00 → šalje
#
# Dva puta godišnje se, dakle, ništa ne mijenja ni u kodu ni u rasporedu.
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '20 10 * * *'
    - cron: '40 10 * * *'
    - cron: '0 11 * * *'
    - cron: '20 11 * * *'
    - cron: '40 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Pošalji i onima koji su stih za danas već dobili (test)'
        type: boolean
        default: false

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provjeri secrete
        # Bez ovoga fali-secret izgleda kao mrežna greška: curl dobije praznu
        # adresu i padne bez objašnjenja.
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          fali=""
          [ -n "$APP_URL" ] || fali="$fali APP_URL"
          [ -n "$CRON_SECRET" ] || fali="$fali CRON_SECRET"
          if [ -n "$fali" ]; then
            echo "::error::Nedostaje secret:$fali (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL mora počinjati s https:// — sad je '$APP_URL'"; exit 1 ;;
          esac

      - name: Je li u Sarajevu prošlo podne
        id: sat
        env:
          POVOD: ${{ github.event_name }}
        run: |
          # Ručno pokretanje ide odmah, bez obzira na sat.
          if [ "$POVOD" != "schedule" ]; then
            echo "salji=da" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sat=$(TZ=Europe/Sarajevo date +%-H)

          # Gornja granica nije kozmetika. Kad GitHub zakasni sat i po, bolje
          # je preskočiti nego poslati stih u pola pet — a sutra ujutro ionako
          # ide novi.
          if [ "$sat" -ge 12 ] && [ "$sat" -le 14 ]; then
            echo "salji=da" >> "$GITHUB_OUTPUT"
          else
            echo "salji=ne" >> "$GITHUB_OUTPUT"
            echo "U Sarajevu je $sat h — nije vrijeme za slanje, ovaj pokušaj staje."
          fi

      - name: Pokreni slanje
        if: steps.sat.outputs.salji == 'da'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          adresa="${APP_URL%/}/api/cron/send-daily"
          # `[ ... ] && ...` ovdje ne valja: korak se vrti pod `bash -e`, pa
          # bi neispunjen uslov kao zadnja naredba oborio cijeli korak.
          if [ "$FORCE" = "true" ]; then
            adresa="$adresa?force=1"
          fi

          # Bez `-f`, namjerno: kod greške nam treba TIJELO odgovora, a ne
          # samo prazan pad. Zeleni workflow uz "due: 0" je isto podatak —
          # znači da je stih već otišao, a ne da se ništa nije desilo.
          kod=$(curl -sS --max-time 240 --retry 2 --retry-delay 15 \
                  -o /tmp/odgovor.json -w '%{http_code}' \
                  -X POST "$adresa" -H "x-cron-secret: $CRON_SECRET")

          echo "HTTP $kod"
          cat /tmp/odgovor.json; echo

          if [ "$kod" != "200" ]; then
            echo "::error::Ruta je vratila $kod"
            exit 1
          fi

          # `failed` je naša greška (npr. pogrešan VAPID ključ) i jedina koja
          # traži da neko pogleda. Prolazne greške ruta sama pokupi u
          # sljedećem pokušaju.
          if grep -q '"failed":[1-9]' /tmp/odgovor.json; then
            echo "::error::Neke obavijesti nisu prošle — pogledaj last_error u bazi"
            exit 1
          fi

          if grep -q '"error"' /tmp/odgovor.json; then
            echo "::error::Ruta je javila grešku"
            exit 1
          fi
