name: Stih dana — push

on:
  schedule:
    # JEDNOM DNEVNO. Ruta ne gleda sat — šalje kad god je pozovemo — pa je
    # ovaj raspored jedino mjesto gdje se podešava kad stih stiže.
    #
    # 10:00 UTC je 12:00 u Sarajevu ljeti, a 11:00 zimi: GitHub prima samo
    # UTC i ne zna za ljetno vrijeme. Ako ti taj sat zimi smeta, prebaci
    # okidač na cron-job.org, gdje se rasporedu zada vremenska zona.
    #
    # Ponovljen poziv ne šalje duplo: `last_sent_on` nosi sarajevski datum
    # stiha, pa drugi prolaz istog dana nema kome.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pokreni slanje
        run: |
          curl -fsS --max-time 240 --retry 2 --retry-delay 15 \
            -X POST "$APP_URL/api/cron/send-daily" \
            -H "x-cron-secret: $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
