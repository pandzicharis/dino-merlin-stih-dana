name: Stih dana — push

on:
  # PAUZIRANO dok je ALWAYS_SEND uključen u app/api/cron/send-daily/route.ts.
  # Tada svaki poziv šalje svima, pa bi satni raspored značio notifikaciju
  # svakom pretplatniku svakih sat vremena. Otkomentariši kad ALWAYS_SEND
  # vrati na false.
  # schedule:
  #   # svaki sat u :05; ruta sama odlučuje kome je vrijeme
  #   - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Pokreni slanje
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/send-daily" \
            -H "x-cron-secret: $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
